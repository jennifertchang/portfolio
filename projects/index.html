    <title>My Projects</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <style>
        .projects{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(15em, 1fr));
            gap: 1em; /* to space out article elements nicely */
        }
        
        article {
            display: grid;
            grid-template-rows:subgrid;
            grid-row: span 3; /*span 3 rows without having to specify the starting row*/
        }

        h1 {
            font-size: 400%; /* making h1 significantly larger than h2*/
        }
        
        h1, h2, h3, h4, h5, h6 {
            line-height: 1.1; /* smaller leading for headings */
            text-wrap: balance; /* prevent uneven lines */
        }

        h2 {
            margin: 0; /* to avoid excessive spacing*/
        }
    </style>
</head>
